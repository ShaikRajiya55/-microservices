version: "3.8"

services:
  opsmatrix-backend:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - WS_PORT=8081
    restart: always

  opsmatrix-frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - opsmatrix-backend
    restart: always
